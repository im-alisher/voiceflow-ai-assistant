<!doctype html>
<html lang="en" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="Voiceflow — voice-first AI assistant workspace." />
    <title>Voiceflow</title>
    <script>
      /*
       * Applies the persisted theme before first paint.
       *
       * Without this the app renders in light mode for a frame (or longer on a
       * slow device) before React hydrates and `next-themes` corrects it —
       * the classic dark-mode flash.
       */
      (function () {
        try {
          var stored = localStorage.getItem('voiceflow.theme');
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          var resolved = stored === 'dark' || stored === 'system' ? (stored === 'system' ? prefersDark : true) : false;
          document.documentElement.classList.toggle('dark', resolved);
          document.documentElement.style.colorScheme = resolved ? 'dark' : 'light';
        } catch (error) {
          document.documentElement.classList.remove('dark');
        }
      })();
    </script>
  </head>
  <body class="h-full">
    <div id="root" class="h-full"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
